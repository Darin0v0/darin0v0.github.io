            web: {
                html: `<div class="box">\n  <h3>Test strony</h3>\n  <p>Edytuj HTML, CSS i JS, a potem kliknij Run.</p>\n  <button id="btn">Kliknij mnie</button>\n  <span id="out">0</span>\n</div>`,

                js: `let licznik = 0;\ndocument.getElementById("btn").addEventListener("click", () => {\n  licznik++;\n  document.getElementById("out").textContent = " -> " + licznik;\n  console.log("Licznik:", licznik);\n});`
            },
            basic: `10 REM prosta petla na start\n20 LET IMIE$ = "Darin"\n30 PRINT "Czesc, "; IMIE$; "!"\n40 FOR I = 1 TO 5\n50   PRINT I; "^2 = "; I * I\n60 NEXT I\n70 END`
        };

        // ==========================================
        // 1B. PRZYKŁADY DO SZYBKIEGO STARTU
        // ==========================================
        const EXAMPLES = {
            'cpp:hello': { lang: 'cpp', code: '#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "Hello, world!" << endl;\n    return 0;\n}' },
            'cpp:sum': { lang: 'cpp', code: '#include <iostream>\nusing namespace std;\n\nint main() {\n    int suma = 0;\n    for (int i = 1; i <= 10; i++) suma += i;\n    cout << "Suma 1..10 = " << suma << endl;\n    return 0;\n}' },
            'c:hello': { lang: 'c', code: '#include <stdio.h>\n\nint main(void) {\n    printf("Hello, world!\\n");\n    return 0;\n}' },
            'web:counter': { lang: 'web', code: {
                html: '<h2>Licznik</h2>\n<button id="plus">+1</button>\n<span id="value">0</span>',
                css: 'body { font-family: monospace; padding: 16px; }\nbutton { padding: 6px 12px; cursor: pointer; }',
                js: 'let n = 0;\ndocument.getElementById("plus").addEventListener("click", () => {\n  n++;\n  document.getElementById("value").textContent = n;\n  console.log("Licznik:", n);\n});'
            } },
            'basic:fib': { lang: 'basic', code: '10 REM ciag Fibonacciego\n20 LET A = 0\n30 LET B = 1\n40 FOR I = 1 TO 10\n50   PRINT A;\n60   LET C = A + B\n70   LET A = B\n80   LET B = C\n90 NEXT I\n99 END' }
        };

                        { cmd: "<a href=\"...\">, <img src=\"...\">", info: "Odnośnik do strony oraz osadzenie obrazka" },
                        { cmd: "<ul>, <li>, <div>", info: "Lista punktowana, pozycja listy oraz blok grupujący" },

<p>Akapit z <a href="#">linkiem</a>.</p>
<ul><li>Punkt A</li><li>Punkt B</li></ul>
<input id="pole" placeholder="wpisz tekst">
<button id="ok">ok</button>`,
                    example: {

                    }

                    desc: "Reguły CSS odpowiadają za wygląd i rozmieszczenie elementów.",

                        { cmd: "margin, padding", info: "Margines na zewnątrz oraz odstęp wewnątrz bloku" },

        // ==========================================
        // 3. STAN APLIKACJI I INICJALIZACJA
        // ==========================================
        const state = {
            lang: 'cpp',
            webTab: 'html',
            wikiTab: 'cpp',
            guideOpen: true,
            code: JSON.parse(JSON.stringify(TEMPLATES))
        };

        const codeArea = document.getElementById('code-area');
        const lineNums = document.getElementById('line-nums');
        const cursorInfo = document.getElementById('cursor-info');

        window.onload = function () {
            // Jeśli CDN Tailwinda nie załadował się, użyj wbudowanego awaryjnego układu
            if (!window.tailwind) document.documentElement.classList.add('no-tailwind');

            let savedTheme = null;
            try { savedTheme = localStorage.getItem('darin_theme'); } catch (e) { /* brak uprawnień */ }
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }

            try {
                const saved = JSON.parse(localStorage.getItem('darin_code'));
                if (saved && saved.web && saved.cpp && saved.c && saved.basic) {
                    state.code = saved;
                }
            } catch (e) {}

            setLanguage('cpp');
        };

        function saveState() {
            try {
                localStorage.setItem('darin_code', JSON.stringify(state.code));
            } catch (e) {}
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.remove('hidden');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.add('hidden'), 2000);
        }

        function setIoStatus(msg) {
            const el = document.getElementById('io-status');
            if (el) el.textContent = msg;
        }

        function toggleIoPanel() {
            const panel = document.getElementById('io-panel');
            const btn = document.getElementById('btn-io');
            const opening = panel.classList.contains('hidden');
            panel.classList.toggle('hidden', !opening);
            panel.classList.toggle('flex', opening);
            btn.setAttribute('aria-expanded', String(opening));
            if (opening) exportCode();
        }

        function currentCodeText() {
            return state.lang === 'web' ? state.code.web[state.webTab] : state.code[state.lang];
        }

        function copyCurrentCode() {
            const text = currentCodeText();
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text)
                    .then(() => showToast('Kod skopiowany do schowka.'))
                    .catch(() => showToast('Schowek niedostępny — zaznacz kod i użyj Ctrl+C.'));
            } else {
                showToast('Schowek niedostępny — zaznacz kod i użyj Ctrl+C.');
            }
        }

        function exportCode() {
            const input = document.getElementById('io-text');
            input.value = JSON.stringify(state.code);
            input.focus();
            input.select();
            setIoStatus('Wyeksportowano kod wszystkich języków.');
        }

        function importCode() {
            try {
                const parsed = JSON.parse(document.getElementById('io-text').value);
                const keys = ['cpp', 'c', 'basic'];
                if (!parsed || typeof parsed !== 'object') throw new Error('oczekiwano obiektu JSON');
                keys.forEach(k => { if (typeof parsed[k] !== 'string') throw new Error('brak kodu dla ' + k); });
                if (!parsed.web || typeof parsed.web.html !== 'string' || typeof parsed.web.css !== 'string' || typeof parsed.web.js !== 'string') {
                    throw new Error('brak sekcji web (html/css/js)');
                }
                state.code = {
                    cpp: parsed.cpp, c: parsed.c, basic: parsed.basic,
                    web: { html: parsed.web.html, css: parsed.web.css, js: parsed.web.js }
                };
                syncEditor();
                saveState();
                if (state.lang === 'web') runWeb();
                setIoStatus('Zaimportowano kod. Liczba języków: 4.');
                showToast('Import zakończony.');
            } catch (e) {
                setIoStatus('Nieprawidłowy JSON: ' + e.message);
            }
        }

        function downloadCode() {
            try {
                const blob = new Blob([JSON.stringify(state.code, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'ide-code.json';
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                setIoStatus('Pobrano plik ide-code.json.');
            } catch (e) {
                setIoStatus('Pobieranie niedostępne: ' + e.message);
            }
        }

        function loadExample(key) {
            const example = EXAMPLES[key];
            if (!example) return;
            if (state.lang !== example.lang) setLanguage(example.lang);
            if (example.lang === 'web') {
                state.code.web = JSON.parse(JSON.stringify(example.code));
            } else {
                state.code[example.lang] = example.code;
            }
            syncEditor();
            saveState();
            runCode();
            showToast('Wczytano przykład.');
            document.getElementById('examples-select').value = '';
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            try { localStorage.setItem('darin_theme', isDark ? 'dark' : 'light'); } catch (e) { /* brak uprawnień */ }
        }

        function toggleGuide() {
            state.guideOpen = !state.guideOpen;
            const guideSec = document.getElementById('guide-section');
            if (state.guideOpen) {
                guideSec.classList.remove('hidden');
                guideSec.classList.add('flex');
            } else {
                guideSec.classList.add('hidden');
                guideSec.classList.remove('flex');
            }
        }

        // ==========================================
        // 4. OBSŁUGA EDYTORA TEKSTU
        // ==========================================
        function updateLines() {
            const count = codeArea.value.split('\n').length;
            let text = '';
            for (let i = 1; i <= count; i++) text += i + '\n';
            lineNums.textContent = text;
            const stats = document.getElementById('code-stats');
            if (stats) stats.textContent = count + ' linii · ' + codeArea.value.length + ' zn.';
        }

        function updateCursor() {
            const before = codeArea.value.substring(0, codeArea.selectionStart);
            const lines = before.split('\n');
            cursorInfo.textContent = `Ln ${lines.length}, Col ${lines[lines.length - 1].length + 1}`;
        }

        codeArea.addEventListener('scroll', () => {
            lineNums.scrollTop = codeArea.scrollTop;
        });

        codeArea.addEventListener('input', () => {
            if (state.lang === 'web') {
                state.code.web[state.webTab] = codeArea.value;
            } else {
                state.code[state.lang] = codeArea.value;
            }
            updateLines();
            updateCursor();
            saveState();
        });

        codeArea.addEventListener('click', updateCursor);
        codeArea.addEventListener('keyup', updateCursor);

        codeArea.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const s = codeArea.selectionStart;
                const end = codeArea.selectionEnd;
                codeArea.value = codeArea.value.substring(0, s) + '    ' + codeArea.value.substring(end);
                codeArea.selectionStart = codeArea.selectionEnd = s + 4;
                codeArea.dispatchEvent(new Event('input'));
            } else if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                runCode();
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                e.preventDefault();
                saveState();
                showToast('Kod zapisany lokalnie.');
            } else if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'c') {
                e.preventDefault();
                copyCurrentCode();
            }
        });

        function syncEditor() {
            codeArea.value = state.lang === 'web'
                ? state.code.web[state.webTab]
                : state.code[state.lang];
            updateLines();
            updateCursor();
        }

        // ==========================================
        // 5. PRZEŁĄCZANIE JĘZYKÓW I ZAKŁADEK
        // ==========================================
        function setLanguage(lang) {
            state.lang = lang;
            const selectEl = document.getElementById('lang-select');
            if (selectEl) selectEl.value = lang;

            const webTabs = document.getElementById('web-tabs');
            const fileLabel = document.getElementById('file-label');
            const webOut = document.getElementById('web-output');
            const conOut = document.getElementById('console-output-wrap');

            if (lang === 'web') {
                webTabs.classList.remove('hidden');
                webTabs.classList.add('flex');
                fileLabel.classList.add('hidden');
                webOut.classList.remove('hidden');
                webOut.classList.add('flex');
                conOut.classList.add('hidden');
                conOut.classList.remove('flex');
            } else {
                webTabs.classList.add('hidden');
                webTabs.classList.remove('flex');
                fileLabel.classList.remove('hidden');
                const names = { cpp: 'main.cpp', c: 'main.c', basic: 'program.bas' };
                fileLabel.textContent = names[lang];

                webOut.classList.add('hidden');
                webOut.classList.remove('flex');
                conOut.classList.remove('hidden');
                conOut.classList.add('flex');
            }

            syncEditor();
            setWikiTab(lang);

            if (lang === 'web') {
                runCode();
            } else {
                document.getElementById('status-text').textContent = 'Konsola (stdout)';
                document.getElementById('terminal-box').textContent = 'Kliknij "Run" (lub Ctrl+Enter), aby uruchomić program.';
            }
        }

        function setWebTab(tab) {
            state.webTab = tab;
            document.querySelectorAll('.web-tab').forEach(btn => {
                btn.className = 'web-tab px-2 py-0.5 text-xs text-[#666666] dark:text-[#888888] hover:text-[#1e1e1e] dark:hover:text-[#e0e0e0]';
            });
            document.getElementById('tab-' + tab).className = 'web-tab px-2 py-0.5 text-xs bg-[#ffffff] dark:bg-[#1e1e1e] text-[#1e1e1e] dark:text-[#ffffff] border border-[#cccccc] dark:border-[#3c3c3c]';
            syncEditor();
        }

        function resetCurrentCode() {
            if (state.lang === 'web') {
                state.code.web = { ...TEMPLATES.web };
            } else {
                state.code[state.lang] = TEMPLATES[state.lang];
            }
            syncEditor();
            saveState();
            showToast('Przywrócono kod domyślny');
            if (state.lang === 'web') runCode();
        }

        // ==========================================
        // 6. URUCHAMIANIE KODU (WEB, C++, C, BASIC)
        // ==========================================
        async function runCode() {
            if (state.lang === 'web') {
                runWeb();
            } else if (state.lang === 'basic') {
                runBasic();
            } else {
                await runCompiler(state.lang);
            }
        }

        // 6A. HTML + CSS + JS w iframe
        function runWeb() {
            const iframe = document.getElementById('preview-frame');
            const jsConsole = document.getElementById('js-console');
            jsConsole.innerHTML = '';

            const hook = `<script>
                (function(){
                    const send = (t, args) => {
                        const msg = Array.from(args).map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
                        window.parent.postMessage({ type: 'js-log', level: t, msg }, '*');
                    };
                    const oLog = console.log, oErr = console.error;
                    console.log = (...a) => { send('log', a); oLog.apply(console, a); };
                    console.error = (...a) => { send('err', a); oErr.apply(console, a); };
                    window.onerror = (m, u, l) => send('err', ['Błąd (linia ' + l + '): ' + m]);
                })();
            <\/script>`;

            iframe.srcdoc = `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>${state.code.web.css}</style>${hook}</head><body>${state.code.web.html}<script>try{${state.code.web.js}}catch(e){console.error(e.message)}<\/script></body></html>`;
        }

        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'js-log') {
                const box = document.getElementById('js-console');
                const row = document.createElement('div');
                row.className = e.data.level === 'err' ? 'text-red-600 dark:text-red-400' : '';
                row.textContent = '$ ' + e.data.msg;
                box.appendChild(row);
                box.scrollTop = box.scrollHeight;
            }
        });

        function clearJsConsole() {
            document.getElementById('js-console').innerHTML = '';
        }

        function clearTerminal() {
            document.getElementById('terminal-box').textContent = '';
        }

        // 6B. Kompilacja C++ i C przez Wandbox (publiczne API Piston jest wyłączone)
        function runCompiler(lang) {
            const btn = document.getElementById('btn-run');
            const statusText = document.getElementById('status-text');
            const term = document.getElementById('terminal-box');
            const code = state.code[lang];

            btn.disabled = true;
            btn.textContent = 'Analizuję...';
            statusText.textContent = 'Analiza offline...';
            term.textContent = 'Sprawdzam strukturę kodu ' + lang.toUpperCase() + '...';

            const issues = [];
            const braces = [(code.match(/\{/g) || []).length, (code.match(/\}/g) || []).length];
            const parens = [(code.match(/\(/g) || []).length, (code.match(/\)/g) || []).length];
            if (braces[0] !== braces[1]) issues.push(`Niezrównoważone nawiasy klamrowe: ${braces[0]} otwarcia, ${braces[1]} zamknięcia.`);
            if (parens[0] !== parens[1]) issues.push(`Niezrównoważone nawiasy okrągłe: ${parens[0]} otwarcia, ${parens[1]} zamknięcia.`);
            if (!/\bmain\s*\(/.test(code)) issues.push('Nie znaleziono funkcji main().');

            const literals = [...code.matchAll(/"((?:\\.|[^"\\])*)"/g)]
                .map((m) => m[1].replace(/\\n/g, '\n').replace(/\\t/g, '\t').replace(/\\"/g, '"'))
                .filter((s) => s.trim() && !/^%[-+0-9.#]*[a-zA-Z]$/.test(s));
            const preview = literals.slice(0, 8);

            if (issues.length) {
                statusText.textContent = 'Błędy statyczne';
                term.textContent = issues.map((x, i) => `${i + 1}. ${x}`).join('\n');
            } else {
                statusText.textContent = 'Analiza offline: OK';
                term.textContent = (preview.length
                    ? preview.join('\n') + '\n\n'
                    : '') + 'Tryb offline: podgląd napisów i kontrola struktury kodu.';
            }
            btn.disabled = false;
            btn.innerHTML = '&#9654; Run';
        }

        // 6C. Wbudowany interpreter języka BASIC
        function runBasic() {
            const code = state.code.basic;
            const stdinLines = document.getElementById('stdin-box').value.split(/\r?\n/).filter(x => x.trim() !== '');
            let stdinIdx = 0;

            const statusText = document.getElementById('status-text');
            const term = document.getElementById('terminal-box');

            try {
                const rawLines = code.split(/\r?\n/);
                const program = [];

                rawLines.forEach((raw, idx) => {
                    const line = raw.trim();
                    if (!line) return;
                    const m = line.match(/^(\d+)\s+(.*)$/);
                    if (m) {
                        program.push({ num: parseInt(m[1], 10), stmt: m[2].trim() });
                    } else {
                        program.push({ num: (idx + 1) * 10, stmt: line });
                    }
                });

                program.sort((a, b) => a.num - b.num);
                const lineMap = new Map();
                program.forEach((item, i) => lineMap.set(item.num, i));

                const vars = {};
                const forStack = [];
                const gosubStack = [];
                const out = [];
                let pc = 0;
                let steps = 0;
                let override = null;

                function evalExpr(expr) {
                    expr = expr.trim();
                    if (!expr) return '';
                    if (/^"[^"]*"$/.test(expr)) return expr.slice(1, -1);

                    let jsExpr = '';
                    let i = 0;
                    while (i < expr.length) {
                        if (expr[i] === '"') {
                            const end = expr.indexOf('"', i + 1);
                            if (end === -1) throw new Error('brak zamykającego cudzysłowu');
                            jsExpr += expr.slice(i, end + 1);
                            i = end + 1;
                            continue;
                        }
                        const strVar = expr.slice(i).match(/^([A-Za-z][A-Za-z0-9_]*)\$/);
                        if (strVar) {
                            const k = strVar[1].toUpperCase() + '$';
                            jsExpr += JSON.stringify(vars[k] !== undefined ? String(vars[k]) : '');
                            i += strVar[0].length;
                            continue;
                        }
                        const word = expr.slice(i).match(/^[A-Za-z][A-Za-z0-9_]*/);
                        if (word) {
                            const u = word[0].toUpperCase();
                            if (u === 'AND') jsExpr += '&&';
                            else if (u === 'OR') jsExpr += '||';
                            else if (u === 'NOT') jsExpr += '!';
                            else if (u === 'MOD') jsExpr += '%';
                            else if (u === 'INT') jsExpr += 'Math.floor';
                            else if (u === 'ABS') jsExpr += 'Math.abs';
                            else if (u === 'SQR') jsExpr += 'Math.sqrt';
                            else jsExpr += (vars[u] !== undefined ? Number(vars[u]) : 0);
                            i += word[0].length;
                            continue;
                        }
                        if (expr.startsWith('<>', i)) { jsExpr += '!='; i += 2; continue; }
                        if (expr.startsWith('!=', i) || expr.startsWith('<=', i) || expr.startsWith('>=', i)) {
                            jsExpr += expr.slice(i, i + 2);
                            i += 2;
                            continue;
                        }
                        if (expr[i] === '=') { jsExpr += '=='; i++; continue; }
                        jsExpr += expr[i];
                        i++;
                    }

                    try {
                        return Function('"use strict"; return (' + jsExpr + ')')();
                    } catch (err) {
                        throw new Error('nie da się obliczyć: ' + expr);
                    }
                }

                function splitPrint(str) {
                    const res = [];
                    let cur = '', inQ = false;
                    for (let i = 0; i < str.length; i++) {
                        if (str[i] === '"') inQ = !inQ;
                        if (!inQ && (str[i] === ';' || str[i] === ',')) {
                            res.push({ expr: cur.trim(), sep: str[i] });
                            cur = '';
                        } else {
                            cur += str[i];
                        }
                    }
                    if (cur.trim() !== '') res.push({ expr: cur.trim(), sep: null });
                    return res;
                }

                while (pc < program.length) {
                    if (++steps > 10000) throw new Error('przekroczono limit kroków (nieskończona pętla).');
                    const cur = program[pc];
                    const stmt = override !== null ? override : cur.stmt;
                    override = null;
                    const up = stmt.toUpperCase();

                    if (up.startsWith('REM') || stmt.startsWith("'")) { pc++; continue; }
                    if (up === 'END' || up === 'STOP') break;

                    if (up.startsWith('PRINT')) {
                        const rest = stmt.slice(5).trim();
                        if (!rest) {
                            out.push('\n');
                        } else {
                            const parts = splitPrint(rest);
                            let lineStr = '', trailing = false;
                            parts.forEach(p => {
                                if (p.expr) lineStr += evalExpr(p.expr);
                                if (p.sep === ',') lineStr += '\t';
                                trailing = (p.sep === ';' || p.sep === ',');
                            });
                            out.push(lineStr + (trailing ? '' : '\n'));
                        }
                        pc++;
                        continue;
                    }

                    if (up.startsWith('INPUT')) {
                        let rest = stmt.slice(5).trim();
                        if (rest.startsWith('"')) {
                            const q = rest.indexOf('"', 1);
                            if (q !== -1) {
                                out.push(rest.slice(1, q));
                                rest = rest.slice(q + 1).replace(/^[;,]\s*/, '').trim();
                            }
                        }
                        const vName = rest.toUpperCase();
                        const rawVal = stdinIdx < stdinLines.length ? stdinLines[stdinIdx++] : '';
                        if (vName.endsWith('$')) {
                            vars[vName] = rawVal;
                        } else {
                            const num = parseFloat(rawVal);
                            vars[vName] = isNaN(num) ? 0 : num;
                        }
                        out.push(rawVal + '\n');
                        pc++;
                        continue;
                    }

                    if (up.startsWith('IF ')) {
                        const thenPos = up.indexOf(' THEN ');
                        if (thenPos === -1) throw new Error('brak THEN w linii ' + cur.num);
                        const cond = stmt.slice(3, thenPos).trim();
                        const after = stmt.slice(thenPos + 6).trim();

                        let elsePos = -1, inQ = false;
                        const upAfter = after.toUpperCase();
                        for (let i = 0; i < after.length; i++) {
                            if (after[i] === '"') inQ = !inQ;
                            if (!inQ && upAfter.startsWith(' ELSE ', i)) { elsePos = i; break; }
                        }

                        const truePart = elsePos !== -1 ? after.slice(0, elsePos).trim() : after;
                        const falsePart = elsePos !== -1 ? after.slice(elsePos + 6).trim() : null;
                        const branch = evalExpr(cond) ? truePart : falsePart;

                        if (branch) {
                            if (/^\d+$/.test(branch)) {
                                const target = parseInt(branch, 10);
                                if (!lineMap.has(target)) throw new Error('nieznana linia ' + target);
                                pc = lineMap.get(target);
                                continue;
                            }
                            override = branch;
                            continue;
                        }
                        pc++;
                        continue;
                    }

                    if (up.startsWith('GOTO ')) {
                        const target = parseInt(stmt.slice(5).trim(), 10);
                        if (!lineMap.has(target)) throw new Error('nieznana linia ' + target);
                        pc = lineMap.get(target);
                        continue;
                    }

                    if (up.startsWith('GOSUB ')) {
                        const target = parseInt(stmt.slice(6).trim(), 10);
                        if (!lineMap.has(target)) throw new Error('nieznana linia ' + target);
                        gosubStack.push(pc + 1);
                        pc = lineMap.get(target);
                        continue;
                    }

                    if (up === 'RETURN') {
                        if (!gosubStack.length) throw new Error('RETURN bez GOSUB w linii ' + cur.num);
                        pc = gosubStack.pop();
                        continue;
                    }

                    if (up.startsWith('FOR ')) {
                        const m = stmt.slice(4).match(/^([A-Za-z][A-Za-z0-9_]*)\s*=\s*(.+?)\s+TO\s+(.+?)(?:\s+STEP\s+(.+))?$/i);
                        if (!m) throw new Error('błędna pętla FOR w linii ' + cur.num);
                        const v = m[1].toUpperCase();
                        vars[v] = Number(evalExpr(m[2]));
                        forStack.push({
                            v,
                            end: Number(evalExpr(m[3])),
                            step: m[4] ? Number(evalExpr(m[4])) : 1,
                            loopPc: pc + 1
                        });
                        pc++;
                        continue;
                    }

                    if (up.startsWith('NEXT')) {
                        if (!forStack.length) throw new Error('NEXT bez FOR w linii ' + cur.num);
                        const top = forStack[forStack.length - 1];
                        vars[top.v] += top.step;
                        const done = top.step >= 0 ? vars[top.v] > top.end : vars[top.v] < top.end;
                        if (!done) {
                            pc = top.loopPc;
                        } else {
                            forStack.pop();
                            pc++;
                        }
                        continue;
                    }

                    const assign = stmt.match(/^(?:LET\s+)?([A-Za-z][A-Za-z0-9_]*\$?)\s*=\s*(.+)$/i);
                    if (assign) {
                        vars[assign[1].toUpperCase()] = evalExpr(assign[2]);
                        pc++;
                        continue;
                    }

                    throw new Error(`nieznana instrukcja w linii ${cur.num}: ${stmt}`);
                }

                statusText.textContent = '> basic: ok';
                term.textContent = out.join('') || '(program zakończył bez wyjścia)';
            } catch (e) {
                statusText.textContent = '> basic: błąd';
                term.textContent = 'błąd: ' + e.message;
            }
        }

        // ==========================================
        // 7. RENDEROWANIE MAŁEGO WIKI JĘZYKÓW
        // ==========================================
        function setWikiTab(tab) {
            state.wikiTab = tab;
            document.querySelectorAll('.wiki-tab').forEach(btn => {
                btn.className = 'wiki-tab px-1.5 py-0.5 text-[11px] text-[#666666] dark:text-[#888888] hover:text-[#1e1e1e] dark:hover:text-[#ffffff]';
            });

            const activeBtn = document.getElementById('wiki-tab-' + tab);
            if (activeBtn) {
                activeBtn.className = 'wiki-tab px-1.5 py-0.5 text-[11px] bg-[#1e1e1e] text-white dark:bg-[#333333] dark:text-[#ffffff]';
            }
            renderWiki();
        }

        function renderWiki() {
            const list = document.getElementById('guide-list');
            const query = (document.getElementById('wiki-search')?.value || '').trim().toLowerCase();

            // Zakładka „★” przeszukuje wiki wszystkich języków naraz
            const entries = state.wikiTab === 'all'
                ? Object.keys(WIKI_DATA).flatMap(lang => WIKI_DATA[lang].map(item => ({ item, lang, idx: WIKI_DATA[lang].indexOf(item) })))
                : (WIKI_DATA[state.wikiTab] || []).map(item => ({ item, lang: state.wikiTab, idx: WIKI_DATA[state.wikiTab].indexOf(item) }));

            const filtered = entries.filter(({ item, lang }) => {
                if (!query) return true;
                const inTitle = item.title.toLowerCase().includes(query);
                const inDesc = item.desc.toLowerCase().includes(query);
                const inCode = item.code.toLowerCase().includes(query);
                const inLang = lang.toLowerCase().includes(query);
                const inCmds = item.commands.some(c =>
                    c.cmd.toLowerCase().includes(query) || c.info.toLowerCase().includes(query)
                );
                return inTitle || inDesc || inCode || inCmds || inLang;
            });

            if (filtered.length === 0) {
                list.innerHTML = `<div class="text-xs text-[#777777] py-4">Brak wyników dla "${query.replace(/</g, '&lt;')}"</div>`;
                return;
            }

            list.innerHTML = filtered.map(({ item, lang, idx }) => {
                const langLabel = { cpp: 'C++', c: 'C', web: 'Web', basic: 'BASIC' }[lang] || lang;
                const rows = item.commands.map(c => `
                    <tr class="border-t border-[#e5e5e5] dark:border-[#2d2d2d]">
                        <td class="py-1 pr-2 text-[11px] text-[#2e7d32] dark:text-[#6fbf73] whitespace-nowrap align-top">${c.cmd.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</td>
                        <td class="py-1 text-[11px] text-[#555555] dark:text-[#a0a0a0] align-top">${c.info}</td>
                    </tr>
                `).join('');

                return `
                <div class="bg-[#ffffff] dark:bg-[#252526] border border-[#d4d4d4] dark:border-[#333333] p-2.5">
                    <div class="flex items-center justify-between gap-2 mb-1">
                        <h3 class="text-xs font-medium text-[#1e1e1e] dark:text-[#e5e5e5]"><span class="text-[#777777]">[${langLabel}]</span> ${item.title}</h3>
                        <button onclick="insertExample(${idx}, '${lang}')" class="px-2 py-0.5 border border-[#cccccc] dark:border-[#444444] hover:border-[#888888] text-[11px] text-[#333333] dark:text-[#cccccc] shrink-0">
                            Wstaw
                        </button>
                    </div>
                    <p class="text-[11px] text-[#666666] dark:text-[#999999] mb-2 leading-relaxed">${item.desc}</p>
                    <div class="overflow-x-auto mb-2">
                        <table class="w-full text-left border-collapse">
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                    <pre class="bg-[#f5f5f5] dark:bg-[#1e1e1e] border border-[#e5e5e5] dark:border-[#2d2d2d] p-2 text-[11px] overflow-x-auto text-[#1e1e1e] dark:text-[#cccccc]"><code>${item.code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>
                </div>
            `}).join('');
        }

        function insertExample(idx, lang) {
            const targetLang = lang || state.wikiTab;
            const item = WIKI_DATA[targetLang] && WIKI_DATA[targetLang][idx];
            const ex = item && item.example;
            if (!ex) return;

            if (state.lang !== targetLang) {
                setLanguage(targetLang);
            }

            if (targetLang === 'web') {
                state.code.web = { ...ex };
            } else {
                state.code[targetLang] = ex;
            }
            syncEditor();
            saveState();
            showToast('wstawiono przykład do bufora');
            runCode();
        }
    </script>
